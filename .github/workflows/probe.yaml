name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [both, ppm-only, cran-only]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install pak
        run: Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch)); cat(format(packageVersion("pak")), "\n")'
      - name: Direct curl from runner (no pak)
        run: |
          for u in https://packagemanager.posit.co/cran/latest/bin/macosx/sonoma-arm64/contrib/4.6/knitr_1.52.tgz \
                   https://cran.rstudio.com/bin/macosx/sonoma-arm64/contrib/4.6/knitr_1.52.tgz \
                   https://packagemanager.posit.co/cran/latest/bin/macosx/sonoma-arm64/contrib/4.6/sf_1.1-3.tgz \
                   https://cran.rstudio.com/bin/macosx/sonoma-arm64/contrib/4.6/sf_1.1-3.tgz; do
            curl -sL -o f "$u"; echo "CURL $(head -c4 f | xxd -p) $(shasum -a 256 f | cut -c1-16) $u"
          done
      - name: pkg_download
        run: Rscript probe.R ${{ matrix.mode }}
      - name: pkg_install
        run: |
          Rscript -e 'm <- "${{ matrix.mode }}"; ppm <- "https://packagemanager.posit.co/cran/latest"; cran <- "https://cran.rstudio.com"; options(repos = switch(m, both = c(RSPM = ppm, CRAN = cran), "ppm-only" = c(CRAN = ppm), "cran-only" = c(CRAN = cran))); pak::cache_clean(); r <- try(pak::pkg_install(c("sf", "knitr", "terra"), lib = tempfile())); cat("INSTALL", m, if (inherits(r, "try-error")) "FAIL" else "OK", "\n")'
